<h1 class="page-title mb-2">Manage Deposits</h1>

<div class="card mb-2">
  <div class="admin-controls">
    <input type="text" class="form-control" placeholder="Search reference..." [(ngModel)]="searchRef" />
    <select class="form-control" [(ngModel)]="selectedStatus">
      <option value="">All Status</option>
      <option value="pending">Pending</option>
      <option value="completed">Completed</option>
      <option value="rejected">Rejected</option>
    </select>
  </div>
</div>

<div class="card">
  <div *ngIf="!deposits" class="loading">Loading deposits...</div>
  <table class="table" *ngIf="deposits">
    <thead>
      <tr>
        <th>Reference</th>
        <th>User</th>
        <th>Amount</th>
        <th>Method</th>
        <th>Status</th>
        <th>Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let deposit of deposits.data">
        <td class="mono small">{{ deposit.reference }}</td>
        <td>
          <div>{{ deposit.user?.name }}</div>
          <div class="muted small">{{ deposit.user?.email }}</div>
        </td>
        <td class="mono">{{ api.money(deposit.amount) }}</td>
        <td>{{ deposit.method | titlecase }}</td>
        <td>
          <span class="badge" [ngClass]="'badge-' + deposit.status">{{ deposit.status }}</span>
        </td>
        <td class="small">{{ deposit.created_at | date: 'mediumDate' }}</td>
        <td>
          <button *ngIf="deposit.status === 'pending'" class="btn btn-xs btn-success" (click)="approve(deposit)">Approve</button>
          <button *ngIf="deposit.status === 'pending'" class="btn btn-xs btn-danger" (click)="reject(deposit)">Reject</button>
          <button class="btn btn-xs btn-outline" (click)="viewDetails(deposit)">Details</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
